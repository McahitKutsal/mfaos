# ./kurulum.exe'yi dogrudan calistirilabilir yapar.
#
# Bicim: :ad:tip:ofset:imza:maske:yorumlayici:bayraklar
#
# awk -F: ile okurken DIKKAT: satir iki nokta ile BASLIYOR, yani $1
# BOS kaliyor ve butun alanlar bir kayiyor — yorumlayici $7,
# bayraklar $8. $6 sanip bos deger okumak bu depoda bir kez yasandi
# (35-windows.sh denetimi derlemeyi durdurdu, iyi oldu).
#   M      = sihirli bayt eslesmesi (uzanti degil — uzantiyi kimse
#            dogrulamiyor, imza yalan soylemez)
#   ofset  = bos, yani 0
#   MZ     = DOS/PE basliginin ilk iki bayti. Gercek bir PE dosyasinda
#            dogrulandi: `head -c2 notepad.exe` -> M Z
#   maske  = bos, tam eslesme
#
# BAYRAK YOK, ozellikle F yok. F ("fix binary") yorumlayiciyi KAYIT
# aninda acip tutuyor ve gercek bir ikili olmasini sart kosuyor; bizim
# yorumlayicimiz kabuk betigi, calisma aninda cozulmesi gerekiyor.
# Imajdaki qemu-aarch64-static.conf F kullaniyor cunku o bir ikili —
# ona bakip F eklemek bu kaydi sessizce bozar.
#
# Yalnizca calistirma bitinin acik oldugu dosyalarda devreye girer,
# yani her .exe degil, kullanicinin acikca isaretledigi .exe.
:mfaos-exe:M::MZ::/usr/libexec/mfaos/run-exe.sh:
