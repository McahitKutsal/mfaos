# Filo zamanlamasi.
#
# RandomizedDelaySec kritik: makineler ayni anda registry'e
# yuklenmesin. Birkac makinede fark etmez, ama altyapiyi bastan
# dogru kur.
#
# Persistent=true: laptop kapaliyken kacirilan calistirma, acilista
# telafi edilir.

[Timer]
OnCalendar=
OnCalendar=daily
RandomizedDelaySec=4h
Persistent=true
