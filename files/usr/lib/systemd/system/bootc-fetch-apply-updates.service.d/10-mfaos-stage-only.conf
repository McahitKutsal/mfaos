# Masaustunde otomatik yeniden baslatma dusmanca bir davranis:
# kullanici calisirken makineyi kapatmak kabul edilemez.
#
# Bunun yerine guncellemeyi indirip pasif slota YAZIYORUZ (stage).
# Kullanici bir sonraki yeniden baslatmada yeni surume gecer.
# Acil bir yama icin kullanici `bootc upgrade --apply` diyebilir.

[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet

# Guncelleme indirmesi arka plan isi — on plandaki ise ayak basmasin.
Nice=10
IOSchedulingClass=idle
CPUSchedulingPolicy=idle
