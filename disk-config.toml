# bootc-image-builder disk duzeni — GERCEK kurulum icin.
#
# NOT: /var'i ayri bolum olarak tanimlayamazsin. bootc/ostree'de /var
# kok dosya sisteminin parcasi ve ostree tarafindan yonetiliyor.
# Tum makine durumu kokun icindeki /var'da yasar, bu yuzden koku genis tut.
#
# Sifreli ayri bir /var istiyorsan bu, gercek makineye kurulum sirasinda
# LUKS ile yapilir — imaj uretiminde degil. Faz 3.
#
# Bu dosyada BILEREK kullanici tanimi yok. QEMU testi icin gereken
# test hesabi disk-config.test.toml icinde; ikisini ayri tutmanin sebebi
# o hesabin kazara gercek kurulum medyasina girmesini imkansiz kilmak.

[[customizations.filesystem]]
mountpoint = "/"
minsize = "30 GiB"
