# bootc-image-builder disk duzeni.
#
# Faz 1'de duz bir disk yeterli. LUKS + TPM muhurleme Faz 3'te,
# kurulum sirasinda elle yapilir (README'ye bak) — image-builder
# TPM muhurlemeyi uretim sirasinda yapamaz, cunku muhur hedef
# makinenin TPM'ine baglidir.

[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

[[customizations.filesystem]]
mountpoint = "/var"
minsize = "15 GiB"

# Test kullanicisi — SADECE QEMU testi icin.
# Gercek kurulumda bu blogu sil; kullaniciyi kurulum sonrasi olustur.
[[customizations.user]]
name = "test"
password = "test"
groups = ["wheel"]
