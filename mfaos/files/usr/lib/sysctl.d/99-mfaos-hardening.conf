# Cekirdek ag ve bellek sertlestirmesi
# Kaynak: KSPP (Kernel Self Protection Project) onerileri

# --- Cekirdek ---
# Cekirdek isaretcilerini sizdirma
kernel.kptr_restrict = 2
# dmesg'i ayricaliksiz kullanicidan gizle
kernel.dmesg_restrict = 1
# BPF'i ayricaliksiz kullanicilara kapat (buyuk saldiri yuzeyi)
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# ptrace'i sadece alt sureclere izin verecek sekilde kisitla
kernel.yama.ptrace_scope = 1
# Cekirdek cokmesinde panikle (saldirgana bilgi sizdirmaktansa dur)
kernel.panic_on_oops = 1
# SysRq tus kombinasyonlarini kapat
kernel.sysrq = 0
# performans olaylarini ayricaliksiz kullanicidan al
kernel.perf_event_paranoid = 3

# --- Dosya sistemi ---
# Sembolik/sabit link saldirilarina karsi
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# setuid programlarin core dump almasini engelle
fs.suid_dumpable = 0

# --- Ag ---
# IP sahteciligine karsi ters yol dogrulamasi
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Yonlendirilmis paketleri kabul etme
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Kaynak yonlendirmeli paketleri kabul etme
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
# SYN flood korumasi
net.ipv4.tcp_syncookies = 1
# Sahte paketleri gunlukle
net.ipv4.conf.all.log_martians = 1
# ICMP yayin isteklerine cevap verme
net.ipv4.icmp_echo_ignore_broadcasts = 1

# --- IPv6 gizlilik ---
# MAC adresinden turetilmeyen, donen gecici adresler kullan.
# Laptop'u farkli aglara tasirken takip edilmeni zorlastirir.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
