name: Build mfaos

on:
  # Gunluk yeniden derleme: Fedora'nin guvenlik yamalarini otomatik
  # devralmanin yolu bu. Bu zamanlayiciyi kapatirsan imajin donar ve
  # CVE bakimi tamamen senin sirtina biner.
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

env:
  FEDORA_VERSION: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      # Bir varyant patlarsa digeri yine de yayinlansin.
      fail-fast: false
      matrix:
        include:
          - variant: base
            image: mfaos
            nvidia: "0"
          # NVIDIA varyanti gecici olarak kapali.
          #
          # Engel: Fedora 44'te akmod paketlerinin %post scriptlet'i bootc
          # konteyner derlemesinde patliyor. akmodsbuild'in kontrolu
          # `[[ -w / ]]` — / dizininin yazilabilir olup olmadigina bakiyor.
          # Gercek ostree sisteminde / salt okunur oldugu icin gecer,
          # konteynerde yazilabilir oldugu icin her zaman patlar.
          # https://bugzilla.redhat.com/show_bug.cgi?id=2459819
          #
          # Cozum yolu: ublue-os/akmods'un onceden derlenmis kmod RPM'lerini
          # cok asamali derlemeyle kopyalamak. Acmak icin alttaki uc satiri ac.
          #
          # - variant: nvidia
          #   image: mfaos-nvidia
          #   nvidia: "1"

    name: ${{ matrix.image }}

    steps:
      - name: Kaynagi al
        uses: actions/checkout@v5

      # GitHub kullanici adi buyuk harf iceriyor (McahitKutsal) ama GHCR
      # yollari kucuk harf olmak zorunda. Bunu cevirmezsen push reddedilir.
      - name: Registry yolunu kucuk harfe cevir
        run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # GitHub runner'larinda OS imaji derlemek icin yer yetmez.
      # NVIDIA varyanti ayrica ~1.5GB ekliyor.
      # NVIDIA varyanti akmod ile birlikte cekirdek derleme araclarini da
      # cekiyor (kernel-devel, gcc, rpm-build) — temel varyanttan ~2GB fazla.
      # Runner'daki varsayilan ~14GB yetmiyor.
      - name: Disk alani ac
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # Takas alanini BIRAKIYORUZ: rpm islemleri bellek yiyor, OOM
          # riskini disk icin almaya degmez.
          swap-storage: false

      - name: Disk durumu
        run: df -h / /home 2>/dev/null || df -h

      - name: Etiketleri hesapla
        id: meta
        run: |
          DATE="$(date -u +%Y%m%d)"
          SHA="$(git rev-parse --short HEAD)"
          echo "tags=${FEDORA_VERSION} ${FEDORA_VERSION}-${DATE} ${FEDORA_VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Imaji derle
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image }}
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: ./Containerfile
          extra-args: |
            --build-arg=FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            --build-arg=NVIDIA_ENABLED=${{ matrix.nvidia }}
            --build-arg=OS_NAME=${{ matrix.image }}
            --build-arg=IMAGE_REF=${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}

      # PR'larda derlemeyi dogrula ama yayinlama.
      - name: Registry'ye gonder
        id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign kur
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # cosign, push adiminin kimlik bilgilerini GORMUYOR: buildah/podman
      # kimligi ${XDG_RUNTIME_DIR}/containers/auth.json'a yaziyor, cosign
      # ise go-containerregistry kullandigi icin ~/.docker/config.json
      # okuyor. Push kimlikli gidiyor ama imza yuklemesi anonim kaliyor.
      - name: cosign'i GHCR'ye baglat
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # Zincirin tamamini anlamli kilan adim bu. Imzalamazsan
      # makinelerin policy.json'u imaji reddeder — ki istedigimiz
      # tam olarak o: imzasiz imaj asla boot etmez.
      - name: Imajı imzala
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${{ matrix.image }}@${DIGEST}"

      - name: Imzayi dogrula
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify --key cosign.pub \
            "${IMAGE_REGISTRY}/${{ matrix.image }}@${DIGEST}"
